<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LinkedIn feed reader</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <p class="eyebrow">Your feed</p>
        <h1>LinkedIn feed reader</h1>
      </div>
      <form id="controls" class="controls">
        <label>
          Posts
          <input id="limit" type="number" min="1" max="100" value="20" />
        </label>
        <button id="start" type="submit">Start</button>
        <button id="stop" type="button" disabled>Stop</button>
      </form>
    </header>
    <p id="status" class="status" role="status">Press Start to open LinkedIn.</p>
    <main id="feed" class="feed" aria-live="polite"></main>
    <script src="/app.js"></script>
  </body>
</html>
